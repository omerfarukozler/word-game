services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordbattle-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=wordbattle;Username=wordbattle;Password=wordbattle
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16-alpine
    container_name: wordbattle-postgres
    environment:
      POSTGRES_DB: wordbattle
      POSTGRES_USER: wordbattle
      POSTGRES_PASSWORD: wordbattle
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wordbattle -d wordbattle"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
